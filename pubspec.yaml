name: rentdesk
description: "RentDesk — Rental Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  share_plus: ^10.1.4
  shimmer: ^3.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/gizebit_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # NO adaptive-icon config on purpose: adaptive icons let the launcher apply
  # its own mask (circle/squircle) which would crop the logo. Legacy icons
  # keep the artwork as-is.
  web:
    generate: false

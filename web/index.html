<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wishes Guestbook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Wishes Guestbook</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F6F4;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      width: 400px;
      height: 100%;
      background: #fff;
      overflow: hidden;
      display: none; /* hidden until Flutter paints first frame */
    }

    #loader {
      color: white;
      font-size: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #AF8B39; /* your brand color */
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- PDF.js v2.x -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    async function extractPdfText(pdfBytesBase64) {
      const pdfDataStr = atob(pdfBytesBase64);
      const pdfData = new Uint8Array(pdfDataStr.length);
      for (let i = 0; i < pdfDataStr.length; i++) {
        pdfData[i] = pdfDataStr.charCodeAt(i);
      }

      const loadingTask = pdfjsLib.getDocument({ data: pdfData });
      const pdf = await loadingTask.promise;
      let fullText = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str).join(' ');
        fullText += pageText + '\n';
      }

      return fullText;
    }

    // Wait for Flutter’s first frame before showing app
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
    });
  </script>
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    Loading app...
  </div>

  <!-- Flutter app -->
  <div id="app-container">
    <script src="flutter_bootstrap.js" async></script>
  </div>
</body>
</html>

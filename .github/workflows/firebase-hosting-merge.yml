name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. SETUP FLUTTER SDK (FIX: Pinned to user's specific version)
      - uses: subosito/flutter-action@v2
        with:
          # IMPORTANT: Using your specific version for reliability
          flutter-version: '3.29.3' 
          
      # 2. DIAGNOSTIC: Confirm Flutter is in PATH
      - name: Verify Flutter Installation

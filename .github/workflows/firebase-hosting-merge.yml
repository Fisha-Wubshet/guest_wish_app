name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. SETUP FLUTTER SDK (Pinned to user's specific version)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3' 
          
      # 2. BUILD AND TEST (FIX: All commands consolidated into one 'run' step)
      - name: Get Dependencies and Build Flutter Web App
        run: |
          # Verify Flutter is installed and available
          flutter --version
          
          # Get packages and build the web assets in the same shell
          flutter pub get
          flutter build web
        
      # 3. DEPLOY TO FIREBASE (Deployment remains separate)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIDU_C46E0 }}
          channelId: live
          projectId: lidu-c46e0
